<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Все ЗАДАЧИ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #333;
}

.container {
    width: 100%;
    max-width: 750px;
    margin: 0 auto;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 35px #0003;
}

h1 {
    text-align: center;
    margin: 0;
}

.subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
}

/* Статистика */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card {
    padding: 15px 10px;
    text-align: center;
    background: #f5f6fa;
    border-radius: 10px;
}

.stat-card strong {
    display: block;
    font-size: 25px;
    color: #667eea;
    margin-bottom: 5px;
}

.stat-card span {
    color: #777;
    font-size: 13px;
}

/* Прогресс */

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #777;
    margin-bottom: 8px;
}

.progress {
    height: 9px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    transition: width .3s;
}

/* Форма */

.form {
    background: #f7f8fc;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.form h3 {
    margin: 0 0 15px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
}

input:focus, textarea:focus, select:focus {
    border-color: #667eea;
}

textarea {
    resize: vertical;
    min-height: 65px;
    margin-top: 10px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

button {
    border: none;
    cursor: pointer;
    border-radius: 8px;
    transition: .2s;
    font-size: 14px;
}

.add-btn {
    width: 100%;
    padding: 13px;
    background: #667eea;
    color: white;
    margin-top: 12px;
}

.add-btn:hover {
    background: #5365d5;
}

.cancel-btn {
    display: none;
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    background: #eee;
    color: #555;
}

/* Поиск и фильтры */

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.toolbar input {
    flex: 1;
    min-width: 0;
}

.toolbar select {
    width: 160px;
}

.filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.filter-btn {
    padding: 9px 14px;
    background: #f0f0f0;
    color: #666;
}

.filter-btn.active {
    background: #667eea;
    color: white;
}

/* Список задач */

.task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 15px;
    margin-bottom: 11px;
    background: #f5f6fa;
    border-radius: 10px;
    border-left: 4px solid #667eea;
}

.task.high {
    border-left-color: #e04444;
}

.task.medium {
    border-left-color: #e6a23c;
}

.task.low {
    border-left-color: #35a879;
}

.task.completed {
    opacity: .65;
}

.task-content {
    flex: 1;
    min-width: 0;
}

.task-title {
    font-weight: bold;
    overflow-wrap: anywhere;
}

.task.completed .task-title {
    text-decoration: line-through;
    color: #999;
}

.task-description {
    font-size: 13px;
    color: #777;
    margin-top: 6px;
    overflow-wrap: anywhere;
}

.task-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 9px;
    font-size: 12px;
}

.tag {
    padding: 5px 8px;
    border-radius: 5px;
    background: #e9eafa;
    color: #667eea;
}

.priority-high {
    background: #ffe5e5;
    color: #d94444;
}

.priority-medium {
    background: #fff1d6;
    color: #b77a15;
}

.priority-low {
    background: #ddf5e9;
    color: #27885d;
}

.overdue {
    color: #e04444;
    font-weight: bold;
}

.check-btn {
    width: 23px;
    height: 23px;
    flex-shrink: 0;
    border: 2px solid #667eea;
    background: white;
    color: white;
}

.completed .check-btn {
    background: #667eea;
}

.actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.edit-btn, .delete-btn {
    padding: 7px 9px;
}

.edit-btn {
    background: #e7eaff;
    color: #5365d5;
}

.delete-btn {
    background: #ffe5e5;
    color: #e04444;
}

.empty {
    text-align: center;
    color: #aaa;
    padding: 30px 10px;
}

.clear-btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #f0f0f0;
    color: #555;
}

.clear-btn:hover, .cancel-btn:hover {
    background: #e4e4e4;
}

@media(max-width: 520px) {
    .container {
        padding: 20px;
    }

    .stats {
        gap: 7px;
    }

    .stat-card {
        padding: 12px 5px;
    }

    .stat-card strong {
        font-size: 21px;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .toolbar {
        flex-direction: column;
    }

    .toolbar select {
        width: 100%;
    }

    .task {
        padding: 11px;
        gap: 8px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Мои задачи</h1>
    <p class="subtitle">Планируй свой день и достигай целей!</p>

    <!-- Статистика -->

    <div class="stats">
        <div class="stat-card">
            <strong id="total">0</strong>
            <span>Всего задач</span>
        </div>

        <div class="stat-card">
            <strong id="completed">0</strong>
            <span>Выполнено</span>
        </div>

        <div class="stat-card">
            <strong id="remaining">0</strong>
            <span>Осталось</span>
        </div>
    </div>

    <!-- Прогресс -->

    <div class="progress-info">
        <span>Прогресс выполнения</span>
        <span id="progressText">0%</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Форма добавления -->

    <div class="form">

        <h3 id="formTitle">Добавить новую задачу</h3>

        <input
            type="text"
            id="taskInput"
            placeholder="Название задачи..."
            maxlength="150"
        >

        <textarea
            id="descriptionInput"
            placeholder="Описание задачи (необязательно)..."
            maxlength="500"
        ></textarea>

        <div class="form-row">

            <select id="priorityInput">
                <option value="low">Низкий приоритет</option>
                <option value="medium" selected>Средний приоритет</option>
                <option value="high">Высокий приоритет</option>
            </select>

            <select id="categoryInput">
                <option value="Личное">Личное</option>
                <option value="Работа">Работа</option>
                <option value="Учёба">Учёба</option>
                <option value="Покупки">Покупки</option>
                <option value="Другое">Другое</option>
            </select>

        </div>

        <input
            type="date"
            id="dateInput"
            style="margin-top:10px"
        >

        <button class="add-btn" id="submitBtn" onclick="addTask()">
            + Добавить задачу
        </button>

        <button class="cancel-btn" id="cancelBtn" onclick="cancelEdit()">
            Отменить редактирование
        </button>

    </div>

    <!-- Поиск -->

    <div class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="Поиск задач..."
            oninput="renderTasks()"
        >

        <select id="sortSelect" onchange="renderTasks()">
            <option value="newest">Сначала новые</option>
            <option value="priority">По приоритету</option>
            <option value="date">По сроку</option>
            <option value="oldest">Сначала старые</option>
        </select>

    </div>

    <!-- Фильтры -->

    <div class="filters">

        <button class="filter-btn active"
                onclick="setFilter('all', this)">
            Все
        </button>

        <button class="filter-btn"
                onclick="setFilter('active', this)">
            Активные
        </button>

        <button class="filter-btn"
                onclick="setFilter('completed', this)">
            Выполненные
        </button>

    </div>

    <!-- Список -->

    <ul id="taskList"
        style="list-style:none;padding:0;margin:0">
    </ul>

    <button class="clear-btn" onclick="clearCompleted()">
        Удалить выполненные задачи
    </button>

</div>

<script>

// Загрузка сохранённых задач

function loadTasks() {
    try {
        const data = JSON.parse(
            localStorage.getItem("tasks") || "[]"
        );

        if (!Array.isArray(data)) return [];

        return data.filter(task =>
            task &&
            Number.isFinite(Number(task.id)) &&
            typeof task.text === "string"
        ).map(task => ({
            ...task,
            id: Number(task.id),
            completed: Boolean(task.completed),
            description: typeof task.description === "string"
                ? task.description : "",
            priority: ["low", "medium", "high"].includes(task.priority)
                ? task.priority : "medium",
            category: typeof task.category === "string"
                ? task.category : "Другое",
            date: typeof task.date === "string" ? task.date : ""
        }));

    } catch (error) {
        console.error("Ошибка загрузки задач:", error);
        return [];
    }
}

let tasks = loadTasks();

let currentFilter = "all";
let editingId = null;


// Сохранение

function saveTasks() {
    try {
        localStorage.setItem(
            "tasks",
            JSON.stringify(tasks)
        );
    } catch (error) {
        alert("Не удалось сохранить задачи. Возможно, хранилище браузера заполнено.");
    }
}


// Добавление задачи

function addTask() {

    const text = document.getElementById("taskInput")
        .value.trim();

    const description = document.getElementById("descriptionInput")
        .value.trim();

    const priority = document.getElementById("priorityInput")
        .value;

    const category = document.getElementById("categoryInput")
        .value;

    const date = document.getElementById("dateInput")
        .value;

    if (!text) {
        alert("Введите название задачи!");
        return;
    }

    if (editingId !== null) {

        tasks = tasks.map(task => {

            if (task.id === editingId) {
                return {
                    ...task,
                    text,
                    description,
                    priority,
                    category,
                    date
                };
            }

            return task;
        });

        editingId = null;

    } else {

        tasks.push({
            id: Date.now(),
            text,
            description,
            priority,
            category,
            date,
            completed: false
        });

    }

    resetForm();
    saveTasks();
    renderTasks();
}


// Очистка формы

function resetForm() {

    document.getElementById("taskInput").value = "";
    document.getElementById("descriptionInput").value = "";
    document.getElementById("priorityInput").value = "medium";
    document.getElementById("categoryInput").value = "Личное";
    document.getElementById("dateInput").value = "";

    document.getElementById("formTitle").textContent =
        "Добавить новую задачу";

    document.getElementById("submitBtn").textContent =
        "+ Добавить задачу";

    document.getElementById("cancelBtn").style.display = "none";

}


// Редактирование задачи

function editTask(id) {

    const task = tasks.find(task => task.id === id);

    if (!task) return;

    editingId = id;

    document.getElementById("taskInput").value = task.text;
    document.getElementById("descriptionInput").value =
        task.description;

    document.getElementById("priorityInput").value =
        task.priority;

    document.getElementById("categoryInput").value =
        task.category;

    document.getElementById("dateInput").value =
        task.date;

    document.getElementById("formTitle").textContent =
        "Редактирование задачи";

    document.getElementById("submitBtn").textContent =
        "Сохранить изменения";

    document.getElementById("cancelBtn").style.display =
        "block";

    document.getElementById("taskInput").focus();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// Отмена редактирования

function cancelEdit() {
    editingId = null;
    resetForm();
}


// Выполнение задачи

function toggleTask(id) {

    tasks = tasks.map(task => {

        if (task.id === id) {
            return {
                ...task,
                completed: !task.completed
            };
        }

        return task;
    });

    saveTasks();
    renderTasks();
}


// Удаление задачи

function deleteTask(id) {

    if (!confirm("Удалить эту задачу?")) return;

    tasks = tasks.filter(task => task.id !== id);

    if (editingId === id) {
        editingId = null;
        resetForm();
    }

    saveTasks();
    renderTasks();
}


// Удаление выполненных

function clearCompleted() {

    const count = tasks.filter(task => task.completed).length;

    if (count === 0) {
        alert("Нет выполненных задач для удаления.");
        return;
    }

    if (!confirm("Удалить все выполненные задачи?")) return;

    tasks = tasks.filter(task => !task.completed);

    saveTasks();
    renderTasks();
}


// Фильтрация

function setFilter(filter, button) {

    currentFilter = filter;

    document.querySelectorAll(".filter-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    renderTasks();
}


// Безопасное создание текстовых элементов

function createElement(tag, className, text) {

    const element = document.createElement(tag);

    if (className) element.className = className;

    if (text !== undefined) {
        element.textContent = text;
    }

    return element;
}


// Отображение задач

function renderTasks() {

    const list = document.getElementById("taskList");

    list.innerHTML = "";

    const search = document.getElementById("searchInput")
        .value.toLowerCase().trim();

    let filtered = tasks.filter(task => {

        if (currentFilter === "active" && task.completed) {
            return false;
        }

        if (currentFilter === "completed" && !task.completed) {
            return false;
        }

        const searchText =
            (task.text + " " + task.description + " " + task.category)
            .toLowerCase();

        return searchText.includes(search);

    });


    // Сортировка

    const sort = document.getElementById("sortSelect").value;

    const priorityOrder = {
        high: 3,
        medium: 2,
        low: 1
    };

    filtered.sort((a, b) => {

        if (sort === "priority") {
            return priorityOrder[b.priority] -
                   priorityOrder[a.priority];
        }

        if (sort === "date") {
            if (!a.date) return 1;
            if (!b.date) return -1;
            return a.date.localeCompare(b.date);
        }

        if (sort === "oldest") {
            return a.id - b.id;
        }

        return b.id - a.id;

    });


    if (filtered.length === 0) {

        const empty = createElement(
            "li",
            "empty",
            tasks.length === 0
                ? "Пока нет задач. Добавьте первую!"
                : "Задачи не найдены."
        );

        list.appendChild(empty);

    }


    // Создание карточек

    filtered.forEach(task => {

        const li = createElement("li", "task " + task.priority);

        if (task.completed) {
            li.classList.add("completed");
        }

        // Кнопка выполнения

        const check = createElement(
            "button",
            "check-btn",
            task.completed ? "✓" : ""
        );

        check.setAttribute("aria-label", "Изменить статус задачи");

        check.onclick = () => toggleTask(task.id);


        // Содержимое

        const content = createElement("div", "task-content");

        const title = createElement(
            "div",
            "task-title",
            task.text
        );

        content.appendChild(title);


        if (task.description) {

            const description = createElement(
                "div",
                "task-description",
                task.description
            );

            content.appendChild(description);

        }


        // Метаданные

        const meta = createElement("div", "task-meta");

        const category = createElement(
            "span",
            "tag",
            task.category
        );

        const priorityNames = {
            high: "Высокий приоритет",
            medium: "Средний приоритет",
            low: "Низкий приоритет"
        };

        const priority = createElement(
            "span",
            "tag priority-" + task.priority,
            priorityNames[task.priority]
        );

        meta.append(category, priority);


        if (task.date) {

            const date = createElement(
                "span",
                "tag",
                "Срок: " + task.date
            );

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const deadline = new Date(task.date + "T00:00:00");

            if (!task.completed && deadline < today) {
                date.classList.add("overdue");
                date.textContent = "Просрочено: " + task.date;
            }

            meta.appendChild(date);

        }

        content.appendChild(meta);


        // Кнопки действий

        const actions = createElement("div", "actions");

        const edit = createElement(
            "button",
            "edit-btn",
            "Изменить"
        );

        edit.onclick = () => editTask(task.id);

        const remove = createElement(
            "button",
            "delete-btn",
            "Удалить"
        );

        remove.onclick = () => deleteTask(task.id);

        actions.append(edit, remove);

        li.append(check, content, actions);

        list.appendChild(li);

    });


    updateStats();

}


// Обновление статистики

function updateStats() {

    const total = tasks.length;

    const completed = tasks.filter(
        task => task.completed
    ).length;

    const remaining = total - completed;

    const progress = total === 0
        ? 0
        : Math.round(completed / total * 100);


    document.getElementById("total").textContent = total;

    document.getElementById("completed").textContent =
        completed;

    document.getElementById("remaining").textContent =
        remaining;

    document.getElementById("progressText").textContent =
        progress + "%";

    document.getElementById("progressBar").style.width =
        progress + "%";

}


// Добавление по Enter

document.getElementById("taskInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            event.preventDefault();
            addTask();
        }

    });


// Первоначальная загрузка

renderTasks();

</script>

</body>
</html>
